
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | BreakPoint</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-box {
            background: #1f2937;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #f59e0b;
        }

        p {
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #4b5563;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #f59e0b;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .message {
            color: #86efac;
            text-align: center;
        }

        a {
            color: #f59e0b;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>BreakPoint</h1>
    <h2>Customer Registration</h2>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account? <a href="/login/">Login</a></p>

</div>

</body>
</html>
